[package]
name = "grid-ai-desktop"
version = "0.0.1"
description = "Grid AI desktop app (Tauri shell over the Python agent core)."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
